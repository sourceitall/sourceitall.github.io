<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 4rem 5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 400px;
      width: 100%;
      transition: all 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
      transform: translateY(-4px);
    }

    .title {
      font-size: 2rem;
      font-weight: 500;
      color: #212121;
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 1rem;
      font-weight: 300;
      color: #616161;
    }

    @media (max-width: 500px) {
      .card {
        padding: 2.5rem 2rem;
      }

      .title {
        font-size: 1.5rem;
      }

      .subtitle {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Coming Soon</div>
    <div class="subtitle">We're working on something awesome. Stay tuned.</div>
  </div>
</body>
</html>
